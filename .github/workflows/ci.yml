name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Ruff and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install constrained development dependencies
        run: pip install -c requirements-ci.txt -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Markdown validation
        run: python -m pytest tests/test_documentation.py --strict-markers

  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install constrained development dependencies
        run: pip install -c requirements-ci.txt -e ".[dev]"
      - name: Run account-free test suite
        run: >-
          python -m pytest --strict-markers -m "not full_data"
          --ignore=tests/test_documentation.py

  terraform-contracts:
    name: Terraform contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # hashicorp/setup-terraform v4.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      # actions/cache v5.0.0
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/**/.terraform.lock.hcl') }}
      - name: Create provider cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Validate mocked Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap platform query operations; do
            terraform -chdir="infra/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$root" validate
            terraform -chdir="infra/$root" test
          done

  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse tracked PowerShell files
        shell: pwsh
        run: |
          $failures = @()
          foreach ($path in (git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failures += $errors | ForEach-Object { "${path}: $($_.Message)" }
            }
          }
          if ($failures.Count -gt 0) {
            throw ($failures -join [Environment]::NewLine)
          }
