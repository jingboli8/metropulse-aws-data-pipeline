[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metropulse-aws-data-pipeline"
version = "0.1.0"
description = "Deterministic MetroPT-3 data-quality pipeline with AWS infrastructure contracts"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "pyarrow>=17,<22",
]

[project.scripts]
metropulse-backfill = "metropulse.backfill:main"
metropulse-verify-local = "metropulse.acceptance:main"
metropulse-audit-continuity = "metropulse.global_audit:main"
metropulse-accept-lambda-fake = "metropulse.aws.acceptance:main"
metropulse-compact-monthly = "metropulse.compaction_cli:main"
metropulse-operations = "metropulse.operations_cli:main"

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0,<7",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
aws = [
  "boto3>=1.35,<2",
]

[tool.setuptools.packages.find]
include = ["metropulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "full_data: requires the ignored complete MetroPT-3 local acceptance dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
