[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metropulse-feasibility"
version = "0.1.0"
description = "Phase -1 feasibility verification for the official UCI MetroPT-3 dataset"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "pyarrow>=17,<22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["metropulse_feasibility*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
